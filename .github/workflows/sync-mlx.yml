name: Sync MLX Bindings

on:
  schedule:
    # Run weekly on Mondays at 00:00 UTC
    - cron: '0 0 * * 1'
  workflow_dispatch:  # Allow manual trigger

jobs:
  sync:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build:ts

      - name: Clone latest MLX
        run: |
          git clone --depth 1 https://github.com/ml-explore/mlx.git /tmp/mlx-source
          echo "MLX_COMMIT=$(cd /tmp/mlx-source && git rev-parse HEAD)" >> $GITHUB_ENV
          echo "MLX_DATE=$(cd /tmp/mlx-source && git log -1 --format=%ci)" >> $GITHUB_ENV

      - name: Generate bindings
        run: npm run generate

      - name: Check for changes
        id: changes
        run: |
          if [ -n "$(git status generated/ --porcelain)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Bindings have changed!"

            # Show diff statistics
            echo "=== Changes ==="
            git diff --stat generated/ || true
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes detected"
          fi

      - name: Create Pull Request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: |
            chore: sync bindings with MLX ${{ env.MLX_COMMIT }}

            Updated from MLX commit: ${{ env.MLX_COMMIT }}
            MLX commit date: ${{ env.MLX_DATE }}

            Auto-generated by sync-mlx workflow.
          branch: sync/mlx-bindings
          delete-branch: true
          title: "chore: sync bindings with latest MLX"
          body: |
            ## Automated MLX Sync

            This PR updates the generated bindings to match the latest MLX Python bindings.

            **MLX Source:**
            - Commit: `${{ env.MLX_COMMIT }}`
            - Date: ${{ env.MLX_DATE }}

            **What changed:**
            Run `npm run generate` locally to see the full diff.

            ---
            *This PR was automatically created by the sync-mlx workflow.*
          labels: |
            automated
            dependencies
