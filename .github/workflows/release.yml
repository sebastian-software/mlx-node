name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-14

    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build:ts

      - name: Clone MLX source
        run: git clone --depth 1 https://github.com/ml-explore/mlx.git /tmp/mlx-source

      - name: Generate bindings
        run: npm run generate

      - name: Build native module
        run: npm run build:native

      - name: Run tests
        run: npm test

      - name: Package prebuilt binary
        run: |
          mkdir -p prebuilds/darwin-arm64
          cp build/Release/mlx_node.node prebuilds/darwin-arm64/

      - name: Upload prebuilt binary
        uses: actions/upload-artifact@v4
        with:
          name: prebuilt-darwin-arm64-node${{ matrix.node-version }}
          path: prebuilds/
          retention-days: 30

  publish:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build:ts

      - name: Download all prebuilt binaries
        uses: actions/download-artifact@v4
        with:
          path: prebuilds/
          pattern: prebuilt-*
          merge-multiple: true

      - name: List prebuilds
        run: find prebuilds -type f

      # Note: Actual publishing disabled until ready
      # - name: Publish to npm
      #   run: npm publish
      #   env:
      #     NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: prebuilds/**/*
          generate_release_notes: true
